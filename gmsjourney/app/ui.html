<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F7F7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111312" media="(prefers-color-scheme: dark)">
<title>Journey Console</title>
<style>
/* Journey Console. Layout: a top bar (journey, device, run status), a section rail, and one working area per
   section. Two source colours carry meaning everywhere: graph (decided by the policy) and project (set by you). */
:root {
  color-scheme: light;
  --bg: #F7F7F5; --panel: #FFFFFF; --sunk: #F0F1EE; --line: #E2E4DF; --line-strong: #CDD1CA;
  --ink: #141716; --ink-2: #4B524E; --ink-3: #737A76;
  --graph: #0B6E60; --graph-bg: #E3F2EE; --proj: #9A5B00; --proj-bg: #FBF0DD;
  --accent: #1F4FD1; --accent-ink: #FFFFFF; --accent-bg: #E8EEFC;
  --ok: #15703A; --ok-bg: #E4F4EA; --warn: #8A5A00; --warn-bg: #FBF1DA; --bad: #B42318; --bad-bg: #FDECEA;
  --run: #1F4FD1; --run-bg: #E8EEFC;
  --shadow: 0 1px 1px rgba(20,23,22,.04), 0 2px 6px rgba(20,23,22,.05);
  --radius: 10px; --radius-s: 6px;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark;
    --bg: #111312; --panel: #181B1A; --sunk: #141716; --line: #2A2F2D; --line-strong: #3A403D;
    --ink: #E9ECEA; --ink-2: #B4BBB7; --ink-3: #8A928E;
    --graph: #5FCDB8; --graph-bg: #12302A; --proj: #E6AA55; --proj-bg: #33260F;
    --accent: #7EA2FF; --accent-ink: #0D1530; --accent-bg: #1A2546;
    --ok: #6CCB8A; --ok-bg: #14301F; --warn: #E6AA55; --warn-bg: #33260F; --bad: #F2847C; --bad-bg: #3A1714;
    --run: #7EA2FF; --run-bg: #1A2546;
    --shadow: 0 1px 1px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25); }
}
* { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; }
@media (pointer: fine) { html { overscroll-behavior: none; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
button, input, select, textarea { font: inherit; color: inherit; }
select, input, textarea { background-color: var(--panel); color: var(--ink); }
a { color: var(--accent); }
code, .mono { font-family: var(--mono); font-size: .88em; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -40px; background: var(--panel); padding: 6px 10px; border-radius: 6px; z-index: 50; }
.skip:focus { top: 8px; }
h1, h2, h3 { margin: 0; line-height: 1.25; text-wrap: balance; }
h1 { font-size: 22px; letter-spacing: -.01em; } h2 { font-size: 17px; } h3 { font-size: 14px; }
p { margin: 0; max-width: 72ch; }
.muted { color: var(--ink-3); } .small { font-size: 12.5px; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 18px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; letter-spacing: -.01em; margin-right: 6px; }
.brand svg { color: var(--graph); }
.field-inline { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; }
#pack { width: min(340px, 34vw); text-overflow: ellipsis; }
.top .field-inline { flex: 0 1 auto; }
.field-inline label { font-size: 12px; color: var(--ink-3); }
.top .spacer { flex: 1; }
.select { height: 32px; border: 1px solid var(--line-strong); border-radius: var(--radius-s); padding: 0 8px; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px;
  font-weight: 550; white-space: nowrap; background: var(--sunk); color: var(--ink-2); border: 1px solid var(--line); }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.pill.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.pill.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.pill.run { background: var(--run-bg); color: var(--run); border-color: transparent; }
.pill.graph { background: var(--graph-bg); color: var(--graph); border-color: transparent; }
.pill.proj { background: var(--proj-bg); color: var(--proj); border-color: transparent; }
a.pill { text-decoration: none; }

.btn { height: 32px; padding: 0 12px; border-radius: var(--radius-s); border: 1px solid var(--line-strong); background: var(--panel);
  cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; touch-action: manipulation;
  transition: background-color .12s, border-color .12s, color .12s; }
.btn:hover { border-color: var(--ink-3); }
a.btn { text-decoration: none; color: inherit; }
a.btn.primary { color: var(--accent-ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--sunk); }
.btn.s { height: 26px; padding: 0 9px; font-size: 12.5px; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.spin { width: 13px; height: 13px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }

/* shell */
.shell { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: calc(100vh - 53px); }
nav.rail { border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px;
  position: sticky; top: 53px; align-self: start; height: calc(100vh - 53px); overflow: auto; }
nav.rail .group { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 12px 10px 4px; }
nav.rail a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: var(--radius-s);
  color: var(--ink-2); text-decoration: none; min-height: 32px; }
nav.rail a:hover { background: var(--sunk); color: var(--ink); }
nav.rail a[aria-current="page"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
nav.rail .count { font-size: 11.5px; color: var(--ink-3); }
nav.rail .key { color: var(--proj); }
main { padding: 22px 26px 80px; min-width: 0; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head .lede { color: var(--ink-2); margin-top: 6px; }

/* panels */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card > .hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.card > .bd { padding: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.stack { display: grid; gap: 16px; align-content: start; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--panel); }
.tile .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tile .l { font-size: 12px; color: var(--ink-3); }
.tile .v.txt { font-size: 14px; font-weight: 600; line-height: 1.35; padding: 3px 0; }
.tile.graph { border-left: 3px solid var(--graph); } .tile.proj { border-left: 3px solid var(--proj); }
.src { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; }
.src.graph { color: var(--graph); } .src.proj { color: var(--proj); }
.src::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
.notice { border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.notice.ok { background: var(--ok-bg); color: var(--ok); } .notice.bad { background: var(--bad-bg); color: var(--bad); }
.notice.warn { background: var(--warn-bg); color: var(--warn); }
.notice.info { background: var(--accent-bg); color: var(--ink); }
.hint { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 16px; }
.hint svg { flex: none; margin-top: 2px; color: var(--accent); }
.hint .txt { flex: 1; min-width: 0; }
.guide ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.guide li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 8px; }
.guide li.next { background: var(--accent-bg); }
.guide .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 600 11px var(--mono); border: 1.5px solid var(--line-strong); color: var(--ink-3); }
.guide li.done .n { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.guide li.done .t { color: var(--ink-2); }
.guide .t { font-weight: 600; } .guide .p { font-size: 12.5px; color: var(--ink-3); }
.fhelp { grid-column: 2; margin-top: -4px; font-size: 12px; color: var(--ink-3); }
.lsum { font-size: 13px; color: var(--ink-2); }
.lsum b { color: var(--ink); font-weight: 600; }
kbd { font: 11px var(--mono); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--panel); }
dialog.help { max-width: 760px; width: calc(100vw - 32px); max-height: calc(100vh - 48px); overflow: auto; }
dialog.help dl { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 8px 14px; font-size: 13px; margin: 8px 0 0; }
dialog.help dt { font-weight: 600; } dialog.help dd { margin: 0; color: var(--ink-2); }
.meaning ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.look { font-size: 12.5px; color: var(--ink-2); background: var(--sunk); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; }
.notice ul { margin: 6px 0 0; padding-left: 18px; }
.empty { padding: 28px; text-align: center; color: var(--ink-3); }

/* tables */
.tw { overflow: auto; max-height: 480px; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { position: sticky; top: 0; background: var(--sunk); font-size: 11.5px; font-weight: 600; color: var(--ink-2); z-index: 1; white-space: nowrap; }
tbody tr:hover { background: color-mix(in srgb, var(--sunk) 60%, transparent); }
td.mono, td .mono { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
tr.click { cursor: pointer; }

/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; flex-wrap: wrap; }
.tabs a { padding: 8px 12px; text-decoration: none; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 6px; font: 12px var(--mono);
  background: var(--sunk); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.chip.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.chip.graph { background: var(--graph-bg); color: var(--graph); border-color: transparent; }
.chip.proj { background: var(--proj-bg); color: var(--proj); border-color: transparent; }
button.chip { cursor: pointer; }
button.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* state machine lanes */
.lanes { display: grid; gap: 8px; }
.lane { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 10px; align-items: start; }
.lane .ln { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); padding-top: 6px; }
.node { font: 12px var(--mono); height: 30px; padding: 0 10px; border-radius: 15px; border: 1.5px solid var(--graph); background: var(--panel); cursor: pointer; }
.node.says { border-style: dashed; border-radius: 6px; }
.node[aria-pressed="true"] { background: var(--graph); color: var(--bg); }

/* factor editor */
.fx { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; }
.flist { position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow: auto; }
.flist .search { padding: 10px; border-bottom: 1px solid var(--line); }
.flist input[type=search] { width: 100%; height: 30px; border: 1px solid var(--line-strong); border-radius: var(--radius-s); padding: 0 8px; }
.flist a { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; padding: 9px 12px; text-decoration: none; color: var(--ink);
  border-bottom: 1px solid var(--line); }
.flist a:hover { background: var(--sunk); }
.flist a[aria-current="true"] { background: var(--proj-bg); }
.flist .fn { font: 12.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flist .fm { grid-column: 1 / -1; font-size: 11.5px; color: var(--ink-3); }
.flist .err { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); align-self: center; }
.form { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 10px 14px; align-items: center; }
.form label { font-size: 12.5px; color: var(--ink-2); }
.input { height: 32px; border: 1px solid var(--line-strong); border-radius: var(--radius-s); padding: 0 9px; width: 100%; min-width: 0; }
textarea.input { height: auto; padding: 7px 9px; resize: vertical; }
.input.mono { font: 12.5px var(--mono); }
.input:hover { border-color: var(--ink-3); }
.level { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.level + .level { margin-top: 10px; }
.level .lh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--sunk);
  border-radius: 8px 8px 0 0; }
.level .lb { padding: 10px; display: grid; gap: 8px; }
.level.default .lh { background: var(--graph-bg); }
.patch { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.patch .kind { font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .06em; padding-top: 6px; }
.patch .kind.bank { color: var(--proj); } .patch .kind.cust { color: var(--accent); } .patch .kind.other { color: var(--ink-3); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
label.row:has(> input[type=checkbox]) { flex-wrap: nowrap; }
label.row > input[type=checkbox] { margin-top: 3px; flex: none; }
label.row > input[type=checkbox] + span { flex: 1; min-width: 0; }
.seq { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.seq .arrow { color: var(--ink-3); font-size: 12px; }
.savebar { position: sticky; bottom: 14px; z-index: 15; display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin-top: 16px;
  background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: 0 6px 24px rgba(0,0,0,.12); }

/* conversation */
.conv { display: grid; gap: 6px; }
.turn { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px; font-size: 13px; }
.turn .who { font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); padding-top: 4px; }
.turn .what { padding: 6px 10px; border-radius: 8px; background: var(--sunk); }
.turn.bot .what { background: var(--graph-bg); }
.turn.customer .what { background: var(--proj-bg); font-family: var(--mono); font-size: 12px; }
.turn.tool .what { background: transparent; border: 1px dashed var(--line-strong); font-family: var(--mono); font-size: 12px; }
.act { font: 600 11.5px var(--mono); }

/* device picker */
.devs { display: flex; flex-wrap: wrap; gap: 6px; }
.devs label { position: relative; display: inline-flex; flex-direction: column; justify-content: center; min-height: 44px; padding: 6px 12px; border: 1px solid var(--line-strong);
  border-radius: 8px; cursor: pointer; background: var(--panel); min-width: 92px; }
.devs input { position: absolute; opacity: 0; pointer-events: none; }
.devs label:has(input:checked) { border-color: var(--accent); background: var(--accent-bg); box-shadow: inset 0 0 0 1px var(--accent); }
.devs label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.devs label:has(input:disabled) { cursor: not-allowed; opacity: .55; }
.devs .dn { font: 600 13px var(--mono); } .devs .dd { font-size: 11px; color: var(--ink-3); }
/* run */
.runlayout { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; align-items: start; }
.steps { list-style: none; margin: 0; padding: 6px; display: grid; gap: 2px; }
.steps button { width: 100%; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left;
  padding: 8px; border: 0; background: transparent; border-radius: 8px; cursor: pointer; min-height: 44px; }
.steps button:hover { background: var(--sunk); }
.steps button[aria-current="true"] { background: var(--sunk); box-shadow: inset 2px 0 0 var(--accent); }
.steps .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 600 11px var(--mono);
  border: 1.5px solid var(--line-strong); color: var(--ink-3); }
.steps .t { font-weight: 550; } .steps .p { font-size: 11.5px; color: var(--ink-3); }
.steps .s { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.st-done .n { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.st-running .n { border-color: var(--run); color: var(--run); }
.st-failed .n { background: var(--bad); border-color: var(--bad); color: var(--bg); }
.st-skipped .t { color: var(--ink-3); text-decoration: line-through; }
.log { font: 12px/1.5 var(--mono); max-height: 260px; overflow: auto; padding: 10px 12px; background: var(--sunk); border-radius: 8px; white-space: pre-wrap; }
details > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; }
.bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
.toast { position: fixed; right: 18px; bottom: 18px; z-index: 60; display: grid; gap: 8px; }
.toast div { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.2); max-width: 420px; }
dialog { border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--panel); color: var(--ink); padding: 18px; max-width: 440px;
  box-shadow: 0 20px 60px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(0,0,0,.3); }
.kv { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; }
@media (max-width: 1100px) { .fx, .runlayout { grid-template-columns: minmax(0, 1fr); } .flist { position: static; max-height: 300px; } }
@media (max-width: 1100px) { .field-inline label { display: none; } #pack { width: min(260px, 30vw); } #help-btn .lbl { display: none; } .top { gap: 10px; } }
@media (max-width: 760px) { .shell { grid-template-columns: minmax(0, 1fr); } nav.rail { position: static; height: auto; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); }
  nav.rail .group { display: none; }
  .top { gap: 8px; } .top .field-inline { flex: 1 1 100%; } #pack { flex: 1; width: auto; } .top .spacer { display: none; } .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } main { padding: 16px; } .form { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="brand"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="2.5" fill="currentColor"/><circle cx="16" cy="4.5" r="2.5" fill="currentColor"/><circle cx="16" cy="15.5" r="2.5" fill="currentColor"/><path d="M6 9.2 14 5.3M6 10.8l8 3.9" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>Journey Console</div>
  <div class="field-inline"><label for="pack">Journey</label><select id="pack" class="select" name="pack"></select></div>
  <span id="validity"></span>
  <div class="spacer"></div>
  <span id="device-pill"></span>
  <span id="run-pill"></span>

}
const $ = s => document.querySelector(s);

}

      h("div", { class: "row", style: "justify-content:flex-end" },

// ---------------------------------------------------------------- state
const S = { meta: null, pack: null, J: null, P: null, dirty: false, issues: [], coverage: null, run: null, runs: null,
            preview: null, timer: null, checkT: null };
const D = () => S.J.domain;
const VIEWS = [

}

// ---------------------------------------------------------------- boot

  const sel = $("#pack");
  sel.replaceChildren(...S.meta.packs.map(p => h("option", { value: p.name }, `${p.title} · ${p.name}`)));
  let want = null; try { want = localStorage.getItem("jc.pack"); } catch {}

async function loadJourney(fresh) {

  try {
    if (meta && !meta.has_project) { await api(`api/journey/${S.pack}/draft`, {}); meta.has_project = true; toast("Drafted a project from the graph"); }

}

}

// ---------------------------------------------------------------- guidance: the getting-started path, page hints, help
const GUIDE = [
  ["valid", "Check the journey is valid", "The project may only use names the policy graph defines. Problems show at the top of Overview.", "#/overview"],
  ["graph", "Look at what the graph decides", "States, tools, rules and limits come from the policy. You read them here; you do not edit them.", "#/graph"],

function gGet() { try { return JSON.parse(localStorage.getItem(`jc.guide.${S.pack}`) || "{}"); } catch { return {}; } }

}

const GLOSSARY = [

// ---------------------------------------------------------------- render

  const out = fn(r);
  if (out) main.replaceChildren(...[out].flat().filter(x => x != null && x !== false));

      h("span", { class: id === "factors" ? "key" : null }, label),
      id === "factors" ? h("span", { class: "count num" }, facN) : id === "graph" && S.J ? h("span", { class: "count num" }, D().states.length) : null))]));

// ---------------------------------------------------------------- overview
function overview() {

// ---------------------------------------------------------------- graph
