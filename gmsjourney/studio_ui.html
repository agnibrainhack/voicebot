<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gmsjourney Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a fixed left rail of sections, a sticky action bar, one working pane; colour marks graph vs project data */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --raised: #fafbfc; --ink: #191d24; --muted: #5b6372; --faint: #8a93a3;
  --line: #dde1e7; --line2: #c9cfd8; --accent: #2156b3; --accent-ink: #ffffff; --accent-soft: #e5edfa;
  --graph: #1c6a3a; --graph-soft: #e0f1e6; --proj: #8a4d00; --proj-soft: #fbefd6;
  --ok: #1b7543; --ok-soft: #e2f2e8; --warn: #8a6100; --warn-soft: #fbf0d3; --bad: #ae2a1c; --bad-soft: #fae5e2;
  --f-body: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  --f-head: "IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #111418; --surface: #191d23; --raised: #1e232a; --ink: #e6e9ee; --muted: #9ca4b2; --faint: #6f7886;
  --line: #2b3139; --line2: #3a414c; --accent: #86abff; --accent-ink: #0f1420; --accent-soft: #1c2944;
  --graph: #7fd3a0; --graph-soft: #15301f; --proj: #f2c46d; --proj-soft: #3a2d10;
  --ok: #6bcf94; --ok-soft: #15301f; --warn: #e9bf5e; --warn-soft: #3a2f12; --bad: #ff8f80; --bad-soft: #3b1d19;
  color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); display: grid; grid-template-columns: 220px 1fr; grid-template-rows: auto 1fr; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 18px;
  background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header h1 { font: 600 1.15rem var(--f-head); margin: 0; }
header .meta { color: var(--muted); font-size: 12.5px; font-family: var(--f-mono); }
header .spacer { flex: 1; }
nav { border-right: 1px solid var(--line); background: var(--surface); padding: 12px 8px; overflow-y: auto; }
nav button { display: flex; width: 100%; justify-content: space-between; align-items: center; text-align: left; border: 0; background: none;
  color: var(--ink); font: 500 13.5px var(--f-body); padding: 8px 10px; border-radius: 6px; cursor: pointer; }
nav button:hover { background: var(--raised); }
nav button.on { background: var(--accent-soft); color: var(--accent); }
nav .grp { font: 500 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 14px 10px 4px; }
main { overflow-y: auto; padding: 20px 24px 80px; min-width: 0; }
h2 { font: 600 1.35rem var(--f-head); margin: 0 0 4px; }
h3 { font: 600 1.02rem var(--f-head); margin: 18px 0 8px; }
p.lede { color: var(--muted); margin: 0 0 16px; max-width: 80ch; }
.btn { font: 500 13px var(--f-body); border: 1px solid var(--line2); background: var(--surface); color: var(--ink); border-radius: 6px;
  padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 2px 8px; font-size: 12px; }
.btn.danger { color: var(--bad); }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font: 500 11.5px var(--f-mono); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill.graph { background: var(--graph-soft); color: var(--graph); }
.pill.proj { background: var(--proj-soft); color: var(--proj); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.n { background: var(--raised); color: var(--muted); border: 1px solid var(--line); }
.mono, code { font-family: var(--f-mono); font-size: 12.5px; }
code { background: var(--raised); border: 1px solid var(--line); padding: 0 4px; border-radius: 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; min-width: 0; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.stat b { display: block; font: 600 1.6rem var(--f-head); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12.5px; }
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; vertical-align: top; padding: 6px 8px; border-bottom: 1px solid var(--line); }
th { font: 500 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--raised); position: sticky; top: 0; }
input, select, textarea { font: 13px var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line2); border-radius: 5px; padding: 4px 6px; max-width: 100%; }
input.mono, textarea.mono { font-family: var(--f-mono); font-size: 12.5px; }
textarea { width: 100%; }
label.f { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.issues { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 8px 12px; margin: 0 0 14px; font-size: 13px; }
.issues li { margin: 2px 0; }
.okbox { background: var(--ok-soft); color: var(--ok); border-radius: 8px; padding: 8px 12px; margin: 0 0 14px; font-size: 13px; }
.factor { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin-bottom: 14px; }
.factor > .fh { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--raised); border-radius: 10px 10px 0 0; }
.factor > .fh .name { font: 600 1.05rem var(--f-head); }
.factor > .fb { padding: 10px 14px; display: grid; gap: 10px; }
.level { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 8px; background: var(--surface); }
.level .lh { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.level .lh .lname { font: 600 13.5px var(--f-mono); }
.op { border-left: 3px solid var(--proj); padding: 4px 8px; display: grid; gap: 6px; background: var(--raised); border-radius: 0 6px 6px 0; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.convo { display: grid; gap: 6px; }
.turn { display: grid; grid-template-columns: 90px 1fr; gap: 8px; align-items: start; }
.turn .who { font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-top: 3px; }
.turn.bot .body { background: var(--accent-soft); border-radius: 8px; padding: 6px 10px; }
.turn.customer .body { background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-family: var(--f-mono); font-size: 12.5px; }
.turn.tool .body { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding: 2px 0; }
.act { display: inline-block; margin: 1px 6px 1px 0; }
.act b { font-family: var(--f-mono); font-size: 12px; }
.act small { color: var(--muted); font-family: var(--f-mono); }
.svgwrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
svg text { fill: var(--ink); font-family: var(--f-body); }
svg .node rect { fill: var(--surface); stroke: var(--line2); }
svg .node.prompt rect { stroke: var(--accent); stroke-width: 1.5; }
svg .node.sel rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
svg .edge { fill: none; stroke: var(--line2); stroke-width: 1.1; }
svg .edge.hi { stroke: var(--accent); stroke-width: 1.8; }
svg .edge.dim { opacity: .15; }
svg .stage { font: 500 10.5px var(--f-mono); letter-spacing: .08em; fill: var(--faint); text-transform: uppercase; }
.toast { position: fixed; right: 18px; bottom: 18px; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 10px 14px; font-size: 13px; z-index: 10; max-width: 420px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 1000px) { .split { grid-template-columns: 1fr; } }
@media (max-width: 760px) { body { grid-template-columns: 1fr; } nav { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px; }
  nav .grp { display: none; } nav button { width: auto; white-space: nowrap; } main { padding: 14px 16px 60px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>gmsjourney Studio</h1>
  <span class="meta" id="meta">loading…</span>
  <span class="spacer"></span>
  <span id="dirty" class="pill n">saved</span>
  <span id="issuecount" class="pill n">checking…</span>
  <button class="btn" id="btnCheck">Check</button>
  <button class="btn primary" id="btnSave">Save</button>
</header>
<nav id="nav"></nav>
<main id="main"><p class="muted">Loading the policy graph and the project…</p></main>
<script>
"use strict";
let S = null;          // server state: domain, derived, coverage, issues, path, fixture_keys
let P = null;          // the project being edited (raw YAML as an object)
let view = "overview";
let selState = null;
let dirty = false;
let lastPreview = null;
let previewLevels = {};
let previewQuestions = [];

// ---------------------------------------------------------------- dom helpers
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const pill = (t, k = "n", title) => h("span", { class: `pill ${k}`, title }, t);
const esc = s => String(s);
function toast(msg) { const t = h("div", { class: "toast" }, msg); document.body.append(t); setTimeout(() => t.remove(), 3500); }
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}
function setDirty(v) { dirty = v; const d = document.getElementById("dirty"); d.textContent = v ? "unsaved changes" : "saved"; d.className = `pill ${v ? "warn" : "n"}`; }
let checkTimer = null;
function changed(rerender = false) { setDirty(true); clearTimeout(checkTimer); checkTimer = setTimeout(runCheck, 600); if (rerender) render(); }
async function runCheck() {
  try { const r = await api("/api/check", { project: P }); S.issues = r.issues; S.coverage = r.coverage; showIssueCount(); if (["overview", "derived"].includes(view)) render(); }
  catch (e) { S.issues = [String(e.message)]; showIssueCount(); }
}
function showIssueCount() {
  const n = (S.issues || []).length, el = document.getElementById("issuecount");
  el.textContent = n ? `${n} problem${n > 1 ? "s" : ""}` : "valid against the graph"; el.className = `pill ${n ? "bad" : "ok"}`;
}

// ---------------------------------------------------------------- domain helpers
const D = () => S.domain;
const statesOfScript = sc => Object.entries(P.customer?.answers || {}).filter(([, v]) => v === sc).map(([k]) => k);
function actsForScript(sc) {
  const sts = statesOfScript(sc).filter(s => D().states.find(x => x.name === s && x.prompts));
  const set = new Set(); sts.forEach(s => D().states.find(x => x.name === s).accepts.forEach(a => set.add(a)));
  return set.size ? [...set] : D().acts.map(a => a.name);
}
function parseFrame(t) {
  const m = /^\s*([A-Z][A-Z0-9_]*)\s*(?:\((.*)\))?\s*$/.exec(String(t || ""));
  if (!m) return { act: "", slots: {} };
  const slots = {};
  (m[2] || "").split(",").map(x => x.trim()).filter(Boolean).forEach(p => { const [k, ...v] = p.split("="); slots[k.trim()] = v.join("=").trim(); });
  return { act: m[1], slots };
}
const frameText = f => `${f.act}(${Object.entries(f.slots).filter(([, v]) => v !== "" && v != null).map(([k, v]) => `${k}=${v}`).join(", ")})`;
function toolStatuses(tool) { const t = D().tools.find(x => x.name === tool); return t ? [t.success, ...t.failures].filter(Boolean) : []; }

// ---------------------------------------------------------------- widgets
function frameEditor(value, onChange, script) {
  const f = parseFrame(value);
  const wrap = h("span", { class: "row" });
  const acts = script ? actsForScript(script) : D().acts.map(a => a.name);
  const sel = h("select", { "aria-label": "customer act", onchange: e => { f.act = e.target.value; f.slots = {}; onChange(frameText(f)); redraw(); } },
    h("option", { value: "" }, "— act —"), ...[...new Set([...acts, f.act].filter(Boolean))].map(a => h("option", { value: a, selected: a === f.act }, a)));
  function redraw() {
    wrap.replaceChildren(sel);
    const spec = D().acts.find(a => a.name === f.act);
    if (!spec) return;
    for (const [slot, q] of Object.entries(spec.slots)) {
      const vals = q.values.length ? q.values : (slot === "credential" ? ["$credential"] : []);
      const cur = f.slots[slot] ?? "";
      let inp;
      if (vals.length) inp = h("select", { "aria-label": slot, onchange: e => { f.slots[slot] = e.target.value; onChange(frameText(f)); } },
        h("option", { value: "" }, q.required ? `${slot}…` : `${slot} (optional)`), ...vals.map(v => h("option", { value: v, selected: String(v) === String(cur) }, v)));
      else inp = h("input", { class: "mono", size: 10, placeholder: slot, value: cur, "aria-label": slot, onchange: e => { f.slots[slot] = e.target.value; onChange(frameText(f)); } });
      wrap.append(inp);
    }
  }
  redraw();
  return wrap;
}
function listEditor(arr, mk, add, label = "add") {
  const box = h("div", { class: "row" });
  const draw = () => {
    box.replaceChildren(...arr.map((v, i) => h("span", { class: "row", style: "gap:4px" }, mk(v, x => { arr[i] = x; changed(); }, i),
      h("button", { class: "btn small danger", title: "remove", onclick: () => { arr.splice(i, 1); changed(); draw(); } }, "×"))),
      h("button", { class: "btn small", onclick: () => { arr.push(add()); changed(); draw(); } }, `+ ${label}`));
  };
  draw();
  return box;
}
function exprInput(obj, key, placeholder) {
  return h("input", { class: "mono", style: "width:100%", placeholder: placeholder || "expression, e.g. level('n_txn') != 0", value: obj[key] ?? "",
    oninput: e => { if (e.target.value.trim()) obj[key] = e.target.value; else delete obj[key]; changed(); } });
}
function statusPicker(tool, value, onChange, multi) {
  const st = toolStatuses(tool);
  if (multi) {
    const arr = Array.isArray(value) ? value : [];
    return listEditor(arr, (v, set) => h("select", { onchange: e => set(e.target.value) }, ...st.map(s => h("option", { selected: s === v }, s))), () => st[0], "call");
  }
  return h("select", { onchange: e => onChange(e.target.value) }, ...st.map(s => h("option", { selected: s === value }, s)));
}

// ---------------------------------------------------------------- views
const VIEWS = [
  ["Overview", "overview"],
  ["Graph", null],
  ["State machine", "states"], ["Tools and numbers", "tools"], ["Vocabulary", "vocab"], ["Rules and triggers", "rules"],
  ["Derived", null],
  ["Names and coverage", "derived"],
  ["Project", null],
  ["Journey factors", "factors"], ["Preview a case", "preview"], ["Bank and customer", "bank"], ["Case rules", "setrules"], ["Scoring and speech", "scoring"], ["YAML", "yaml"],
];
function renderNav() {
  const nav = document.getElementById("nav");
  nav.replaceChildren(...VIEWS.map(([t, k]) => k === null ? h("div", { class: "grp" }, t) :
    h("button", { class: view === k ? "on" : "", onclick: () => { view = k; render(); } }, t,
      k === "factors" ? pill(String(P.factors?.length || 0)) : k === "states" ? pill(String(D().states.length)) : null)));
}
function render() {
  renderNav();
  const m = document.getElementById("main");
  m.replaceChildren(...(({ overview, states, tools, vocab, rules, derived, factors, preview, bank, setrules, scoring, yaml })[view]()).flat().filter(Boolean));
  m.scrollTop = m.scrollTop;
}
function issuesBlock(filter) {
  const list = (S.issues || []).filter(i => !filter || i.startsWith(filter));
  if (!list.length) return filter ? null : h("div", { class: "okbox" }, "The project is valid against the policy graph.");
  return h("ul", { class: "issues" }, ...list.map(i => h("li", {}, i)));
}

function overview() {
  const d = D(), c = S.coverage || {};
  const nLevels = (P.factors || []).reduce((n, f) => n + Object.keys(f.levels || {}).length, 0);
  return [
    h("h2", {}, d.title || "Policy graph"),
    h("p", { class: "lede" }, "The policy graph defines the domain: dialog states, the customer's acts, tools and their statuses, limits, rules. ",
      "The project file holds what the graph cannot decide: the mock bank, the simulated customer and the journey factors. ",
      pill("graph", "graph"), " marks what is read from the graph, ", pill("project", "proj"), " what you configure here."),
    issuesBlock(),
    h("h3", {}, "From the graph"),
    h("div", { class: "grid" }, ...Object.entries(d.summary).map(([k, v]) => h("div", { class: "stat" }, h("b", {}, v), h("span", {}, k.replace(/_/g, " "))))),
    h("h3", {}, "In the project"),
    h("div", { class: "grid" },
      h("div", { class: "stat" }, h("b", {}, (P.factors || []).length), h("span", {}, "journey factors")),
      h("div", { class: "stat" }, h("b", {}, nLevels), h("span", {}, "levels")),
      h("div", { class: "stat" }, h("b", {}, (P.constraints || []).length), h("span", {}, "constraints")),
      h("div", { class: "stat" }, h("b", {}, `${c.transitions_reached ?? "–"}/${c.transitions_total ?? "–"}`), h("span", {}, "transition paths the levels reach")),
      h("div", { class: "stat" }, h("b", {}, (c.rules_not_reached || []).length), h("span", {}, "rules no level reaches")),
      h("div", { class: "stat" }, h("b", {}, Object.values(c.customer_choices_missing || {}).flat().length), h("span", {}, "customer choices never scripted"))),
    h("p", { class: "small muted" }, "Coverage samples a few valid cases around every level (turn-limit padding is added only by the case generator, so the turn limit reads as not reached here). See Names and coverage for the detail."),
  ];
}

// ---- state machine
function stateLayout() {
  const d = D(), order = d.stages, cols = {};
  d.states.forEach(s => { (cols[s.stage] = cols[s.stage] || []).push(s); });
  const W = 172, GX = 46, Hn = 30, GY = 14, top = 34;
  const pos = {}; let x = 14, maxY = 0;
  order.forEach(st => { (cols[st] || []).forEach((s, i) => { pos[s.name] = { x, y: top + i * (Hn + GY), w: W, h: Hn }; maxY = Math.max(maxY, top + (i + 1) * (Hn + GY)); }); x += W + GX; });
  return { pos, width: x, height: maxY + 10, order, W };
}
function stateSvg() {
  const d = D(), L = stateLayout(), ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${L.width} ${L.height}`); svg.setAttribute("width", L.width); svg.setAttribute("height", L.height);
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "dialog states by stage, with their transitions");
  const mk = (tag, a) => { const e = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); return e; };
  let x = 14; L.order.forEach(st => { const t = mk("text", { x, y: 18, class: "stage" }); t.textContent = st; svg.append(t); x += L.W + 46; });
  const pairs = new Map();
  d.states.forEach(s => s.out.forEach(t => pairs.set(`${s.name}>${t.dst}`, [s.name, t.dst])));
  const eg = mk("g", {});
  for (const [key, [a, b]] of pairs) {
    const A = L.pos[a], B = L.pos[b]; if (!A || !B) continue;
    let dPath;
    if (a === b) dPath = `M${A.x + A.w - 20},${A.y} c 10,-16 30,-16 20,0`;
    else {
      const x1 = B.x >= A.x + A.w ? A.x + A.w : A.x, y1 = A.y + A.h / 2, x2 = B.x >= A.x + A.w ? B.x : (B.x + B.w <= A.x ? B.x + B.w : B.x + B.w / 2), y2 = B.y + B.h / 2;
      const mx = (x1 + x2) / 2; dPath = `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
    }
    const cls = !selState ? "edge" : (a === selState || b === selState) ? "edge hi" : "edge dim";
    eg.append(mk("path", { d: dPath, class: cls }));
  }
  svg.append(eg);
