<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#060B15" media="(prefers-color-scheme: dark)">
<script>try { const m = localStorage.getItem("jc.theme"); if (m === "day" || m === "night") document.documentElement.dataset.theme = m; } catch {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<title>Journey Console</title>
<style>
/* Journey Console — "blueprint" theme.
   The policy graph is the blueprint and this console is the drafting table: day is white drafting film with
   Prussian-blue ink, night is the blue-black of a cyanotype. Blue is the only family used for structure; colour that
   is not blue always means something (cyan = decided by the graph, violet = set by you, green / amber / red = status).
   The one expressive element is the route in the left rail: the five stages of the work as stations on a line. */
:root {
  color-scheme: light;
  --bg: #F3F6FB; --panel: #FFFFFF; --sunk: #EAF0F8; --line: #D6E0EE; --line-strong: #B9C8DD;
  --ink: #0D1B30; --ink-2: #384A64; --ink-3: #62748E;
  --accent: #1D4ED8; --accent-ink: #FFFFFF; --accent-bg: #E3EBFC; --accent-2: #173EAD;
  --graph: #0A6B96; --graph-bg: #E1F1F8; --proj: #6236C9; --proj-bg: #EFE9FC;
  --ok: #0F7A55; --ok-bg: #E2F4EC; --warn: #8F5E00; --warn-bg: #FBF0D9; --bad: #BE2F28; --bad-bg: #FCE8E6;
  --run: #1D4ED8; --run-bg: #E3EBFC;
  --grid: rgba(29, 78, 216, .055);
  --float: 0 10px 30px rgba(13, 27, 48, .14), 0 2px 6px rgba(13, 27, 48, .06);
  --shadow: none;
  --radius: 12px; --radius-s: 7px;
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --head: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", ui-sans-serif, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sc-customer: #1D5FD0; --sc-bot: #C2560C; --sc-both: #6236C9; --sc-flow: #0A7F8F; --sc-rules: #B0266B; --sc-knowledge: #8A6A00; --sc-other: #6B7A90;
}
:root[data-theme="night"] {
  color-scheme: dark;
  --bg: #060B15; --panel: #0C1424; --sunk: #091120; --line: #1A2740; --line-strong: #2A3B5A;
  --ink: #E2E9F5; --ink-2: #A8B7CE; --ink-3: #7487A3;
  --accent: #6F9BFF; --accent-ink: #061024; --accent-bg: #13234A; --accent-2: #9DBBFF;
  --graph: #4FC1EE; --graph-bg: #0B2638; --proj: #B9A0FF; --proj-bg: #1F1745;
  --ok: #4CCB9B; --ok-bg: #0C2A22; --warn: #F0B651; --warn-bg: #2E2209; --bad: #FF7F74; --bad-bg: #36110F;
  --run: #6F9BFF; --run-bg: #13234A;
  --grid: rgba(111, 155, 255, .06);
  --float: 0 14px 40px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .35);
  --sc-customer: #6FA4FF; --sc-bot: #F49456; --sc-both: #B9A0FF; --sc-flow: #4FD1D9; --sc-rules: #F07DB8; --sc-knowledge: #E0BA52; --sc-other: #8C9BB3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="day"]) {
    color-scheme: dark;
    --bg: #060B15; --panel: #0C1424; --sunk: #091120; --line: #1A2740; --line-strong: #2A3B5A;
    --ink: #E2E9F5; --ink-2: #A8B7CE; --ink-3: #7487A3;
    --accent: #6F9BFF; --accent-ink: #061024; --accent-bg: #13234A; --accent-2: #9DBBFF;
    --graph: #4FC1EE; --graph-bg: #0B2638; --proj: #B9A0FF; --proj-bg: #1F1745;
    --ok: #4CCB9B; --ok-bg: #0C2A22; --warn: #F0B651; --warn-bg: #2E2209; --bad: #FF7F74; --bad-bg: #36110F;
    --run: #6F9BFF; --run-bg: #13234A;
    --grid: rgba(111, 155, 255, .06);
    --float: 0 14px 40px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .35);
    --sc-customer: #6FA4FF; --sc-bot: #F49456; --sc-both: #B9A0FF; --sc-flow: #4FD1D9; --sc-rules: #F07DB8; --sc-knowledge: #E0BA52; --sc-other: #8C9BB3;
  }
}

/* base */
* { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; }
@media (pointer: fine) { html { overscroll-behavior: none; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
select, input, textarea { background-color: var(--panel); color: var(--ink); }
a { color: var(--accent); text-underline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: .9em; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent-bg); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -40px; background: var(--panel); padding: 6px 10px; border-radius: 6px; z-index: 50; }
.skip:focus { top: 8px; }
h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; font-family: var(--head); font-weight: 600; }
h1 { font-size: 28px; letter-spacing: -.005em; }
h2 { font-size: 18px; }
h3 { font-size: 15px; }
p { margin: 0; max-width: 74ch; }
.muted { color: var(--ink-3); } .small { font-size: 12.5px; }

/* top bar: the journey you are on, and the machine it runs on */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  min-height: 56px; padding: 9px 20px; background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font: 600 16px var(--head); letter-spacing: .01em; margin-right: 8px; white-space: nowrap; }
.brand svg { color: var(--accent); }
.field-inline { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; }
.gopen { background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 3px 3px 3px 10px; flex: 1 1 360px !important; min-width: 220px; max-width: 600px; }
.gopen label { font-size: 12px; color: var(--ink-3); }
.gopen #gpath { border: 0; background: transparent; height: 30px; flex: 1; width: auto; min-width: 60px; text-overflow: ellipsis; font-size: 12.5px; padding: 0 4px; }
.gopen #gpath:focus-visible { outline: none; }
.gopen:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.gopen .btn { height: 30px; }
.gopen #gpack:empty { display: none; }
.top .field-inline { flex: 0 1 auto; }
.top .spacer { flex: 0 1 0; }
@media (min-width: 761px) { .top { flex-wrap: nowrap; } .top > * { flex-shrink: 0; } .top > .gopen { flex-shrink: 1; } }
.select { height: 32px; border: 1px solid var(--line-strong); border-radius: var(--radius-s); padding: 0 8px; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px;
  font-weight: 500; white-space: nowrap; background: var(--sunk); color: var(--ink-2); border: 1px solid var(--line); }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.pill.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.pill.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.pill.run { background: var(--run-bg); color: var(--run); border-color: transparent; }
.pill.graph { background: var(--graph-bg); color: var(--graph); border-color: transparent; font-family: var(--mono); font-size: 11.5px; }
.pill.proj { background: var(--proj-bg); color: var(--proj); border-color: transparent; }
a.pill { text-decoration: none; }
a.pill:hover { filter: brightness(.97); }

/* buttons: one primary per screen, the rest outlined; ghost for quiet actions */
.btn { height: 34px; padding: 0 14px; border-radius: var(--radius-s); border: 1px solid var(--line-strong); background: var(--panel);
  cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; touch-action: manipulation; font-weight: 500;
  transition: background-color .12s, border-color .12s, color .12s; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
a.btn { text-decoration: none; color: inherit; }
a.btn:hover { color: var(--accent); }
.btn.primary, a.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover, a.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); color: var(--accent-ink); }
:root[data-theme="night"] .btn.primary:hover { color: var(--accent-ink); }
.btn.danger { color: var(--bad); } .btn.danger:hover { border-color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--sunk); color: var(--ink); }
.btn.s { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.icon { width: 34px; padding: 0; justify-content: center; }
.spin { width: 13px; height: 13px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } * { transition: none !important; } }

/* theme switch: auto / day / night */
.theme { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--sunk); }
.theme .tl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.theme button { border: 0; background: transparent; height: 26px; min-width: 30px; padding: 0 8px; border-radius: 999px; cursor: pointer;
  color: var(--ink-3); display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 12px; }
.theme button[aria-pressed="true"] { background: var(--panel); color: var(--accent); box-shadow: 0 1px 2px rgba(13,27,48,.12); }
.theme button:hover { color: var(--ink); }

/* shell */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100vh - 56px); }
main { padding: 28px 34px 96px; min-width: 0; }
main > * { max-width: 1320px; }

/* the route: five stages of the work as stations on a line */
nav.rail { border-right: 1px solid var(--line); padding: 20px 14px 24px; position: sticky; top: 56px; align-self: start;
  height: calc(100vh - 56px); overflow: auto; background: var(--panel); }
.route { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.stn { position: relative; padding: 0 0 14px 34px; }
.stn::before { content: ""; position: absolute; left: 11px; top: 26px; bottom: -2px; width: 2px; border-radius: 2px; background: var(--line); }
.stn:last-child::before { display: none; }
.stn.done::before { background: var(--accent); }
.stn .dot { position: absolute; left: 0; top: 2px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  font: 600 11.5px var(--mono); background: var(--panel); border: 2px solid var(--line-strong); color: var(--ink-3); }
.stn.done .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.stn.here .dot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-bg); }
.stn .sh { display: block; font: 600 14px/1.25 var(--head); color: var(--ink); padding-top: 4px; letter-spacing: .01em; }
.stn .sp { display: block; font-size: 11.5px; color: var(--ink-3); margin: 1px 0 6px; }
.stn ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.stn a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 9px; margin-left: -9px; border-radius: 7px;
  color: var(--ink-2); text-decoration: none; min-height: 30px; font-size: 13.5px; }
.stn a:hover { background: var(--sunk); color: var(--ink); }
.stn a[aria-current="page"] { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
:root[data-theme="night"] .stn a[aria-current="page"] { color: var(--accent-2); }
.stn .count { font: 11px var(--mono); color: var(--ink-3); }
.stn a.key .lbl { color: var(--proj); }
.rail-foot { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-3); display: grid; gap: 6px; }
.rail-foot .legend { display: flex; align-items: center; gap: 7px; }
.rail-foot .sw { width: 10px; height: 10px; border-radius: 3px; }

/* page head: where you are, what this page is for, the page's actions */
.crumb { font-size: 12.5px; color: var(--ink-3); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.crumb b { font: 600 11.5px var(--mono); color: var(--accent); background: var(--accent-bg); border-radius: 5px; padding: 1px 6px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 22px;
  padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.page-head .lede { color: var(--ink-2); margin-top: 8px; font-size: 14.5px; }

/* next step: the forward path on every page */
.pagefoot { margin-top: 30px; display: flex; justify-content: flex-end; }
.pagefoot a { display: grid; gap: 1px; text-decoration: none; padding: 12px 18px 12px 16px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--panel); min-width: 260px; color: var(--ink); }
.pagefoot a:hover { border-color: var(--accent); }
.pagefoot .k { font-size: 12px; color: var(--ink-3); }
.pagefoot .t { font: 600 15px var(--head); color: var(--accent); display: flex; align-items: center; gap: 8px; }

/* the next-step strip on Overview (replaces the long checklist; the full list is in Help) */
.guide { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px 18px; margin-bottom: 22px;
  border-radius: var(--radius); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); background: var(--accent-bg); }
.guide .meter { display: flex; gap: 4px; }
.guide .meter i { width: 18px; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--accent) 22%, transparent); }
.guide .meter i.on { background: var(--accent); }
.guide .t { font: 600 16px var(--head); }
.guide .p { font-size: 13px; color: var(--ink-2); }
.guide .k { font-size: 12px; color: var(--ink-3); margin-bottom: 2px; }
.guide .acts { display: flex; gap: 6px; align-items: center; }

/* panels: flat sheets ruled by hairlines; only floating things cast a shadow */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.card > .hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
.card > .bd { padding: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.stack { display: grid; gap: 16px; align-content: start; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 14px 18px; }
.tile { padding: 2px 0 2px 12px; border-left: 2px solid var(--line); }
.tile.graph { border-left-color: color-mix(in srgb, var(--graph) 45%, var(--line)); } .tile.proj { border-left-color: color-mix(in srgb, var(--proj) 45%, var(--line)); }
.tile .v { font: 600 24px/1.15 var(--head); font-variant-numeric: tabular-nums; }
.tile .l { font-size: 12px; color: var(--ink-3); }
.tile .v.txt { font: 600 14px/1.35 var(--sans); padding: 4px 0; }
.tile.graph .v { color: var(--graph); } .tile.proj .v { color: var(--proj); }
.src { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.src.graph { color: var(--graph); } .src.proj { color: var(--proj); }
.src::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: currentColor; }
.notice { border-radius: 9px; padding: 11px 14px; font-size: 13px; border: 1px solid transparent; }
.notice.ok { background: var(--ok-bg); color: var(--ok); } .notice.bad { background: var(--bad-bg); color: var(--bad); }
.notice.warn { background: var(--warn-bg); color: var(--warn); }
.notice.info { background: var(--panel); color: var(--ink); border-color: var(--line); border-left: 3px solid var(--accent); }
.hint { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 18px; }
.hint svg { flex: none; margin-top: 2px; color: var(--accent); }
.hint .txt { flex: 1; min-width: 0; color: var(--ink-2); }
.fhelp { grid-column: 2; margin-top: -4px; font-size: 12px; color: var(--ink-3); }
.lsum { font-size: 13px; color: var(--ink-2); }
.lsum b { color: var(--ink); font-weight: 600; }
kbd { font: 11px var(--mono); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--panel); }
dialog.help { max-width: 780px; width: calc(100vw - 32px); max-height: calc(100vh - 48px); overflow: auto; }
dialog.help dl { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 8px 14px; font-size: 13px; margin: 8px 0 0; }
dialog.help dt { font-weight: 600; } dialog.help dd { margin: 0; color: var(--ink-2); }
dialog.help ol li.done { color: var(--ink-3); }
.meaning ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.look { font-size: 12.5px; color: var(--ink-2); background: var(--sunk); border-radius: 8px; padding: 9px 11px; margin-bottom: 12px; }
.notice ul { margin: 6px 0 0; padding-left: 18px; }
.empty { padding: 40px 28px; text-align: center; color: var(--ink-3); border: 1px dashed var(--line-strong); border-radius: var(--radius); }

/* tables */
.tw { overflow: auto; max-height: 480px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 11px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
th { position: sticky; top: 0; background: var(--sunk); font-size: 12px; font-weight: 600; color: var(--ink-2); z-index: 1; white-space: nowrap; }
tbody tr:hover { background: color-mix(in srgb, var(--accent-bg) 45%, transparent); }
td.mono, td .mono { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
tr.click { cursor: pointer; }

/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; flex-wrap: wrap; }
.tabs a { padding: 9px 13px; text-decoration: none; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

/* chips: names from the graph are identifiers, so they are set in mono */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 6px; font: 12px var(--mono);
  background: var(--sunk); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.chip.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.chip.graph { background: var(--graph-bg); color: var(--graph); border-color: transparent; }
.chip.proj { background: var(--proj-bg); color: var(--proj); border-color: transparent; }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--accent); }
button.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* state machine lanes, drawn on the blueprint grid */
.lanes { display: grid; gap: 10px; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 16px 16px; border-radius: 0 0 var(--radius) var(--radius); }
.lane { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 10px; align-items: start; }
.lane .ln { font: 500 11.5px var(--mono); color: var(--ink-3); padding-top: 7px; }
.node { font: 12px var(--mono); height: 30px; padding: 0 11px; border-radius: 15px; border: 1.5px solid var(--graph); background: var(--panel); color: var(--ink); cursor: pointer; }
.node:hover { background: var(--graph-bg); }
.node.says { border-style: dashed; border-radius: 6px; }
.node[aria-pressed="true"] { background: var(--graph); color: var(--panel); }

/* factor editor */
.fx { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 18px; align-items: start; }
.flist { position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow: auto; }
.flist .search { padding: 10px; border-bottom: 1px solid var(--line); }
.flist input[type=search] { width: 100%; height: 32px; border: 1px solid var(--line-strong); border-radius: var(--radius-s); padding: 0 9px; }
.flist a { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; padding: 9px 13px; text-decoration: none; color: var(--ink);
  border-bottom: 1px solid var(--line); border-left: 3px solid transparent; }
.flist a:hover { background: var(--sunk); }
.flist a[aria-current="true"] { background: var(--proj-bg); border-left-color: var(--proj); }
.flist .fn { font: 12.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flist .fm { grid-column: 1 / -1; font-size: 11.5px; color: var(--ink-3); }
.flist .err { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); align-self: center; }
.form { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px 14px; align-items: center; }
.form label { font-size: 12.5px; color: var(--ink-2); }
.input { height: 34px; border: 1px solid var(--line-strong); border-radius: var(--radius-s); padding: 0 10px; width: 100%; min-width: 0; }
textarea.input { height: auto; padding: 8px 10px; resize: vertical; }
.input.mono { font: 12.5px var(--mono); }
.input:hover { border-color: var(--ink-3); }
.input:focus-visible, .select:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.level { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.level + .level { margin-top: 10px; }
.level .lh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--sunk);
  border-radius: 10px 10px 0 0; }
.level .lb { padding: 12px; display: grid; gap: 8px; }
.level.default .lh { background: var(--graph-bg); }
.patch { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.patch .kind { font: 600 12px var(--sans); padding-top: 6px; }
.patch .kind.bank { color: var(--proj); } .patch .kind.cust { color: var(--accent); } .patch .kind.other { color: var(--ink-3); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
label.row:has(> input[type=checkbox]) { flex-wrap: nowrap; }
label.row > input[type=checkbox] { margin-top: 3px; flex: none; accent-color: var(--accent); }
label.row > input[type=checkbox] + span { flex: 1; min-width: 0; }
.seq { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.seq .arrow { color: var(--ink-3); font-size: 12px; }
.savebar { position: sticky; bottom: 16px; z-index: 15; display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin-top: 18px;
  background: var(--panel); border: 1px solid var(--accent); border-radius: var(--radius); box-shadow: var(--float); }

/* conversation */
.conv { display: grid; gap: 6px; }
.turn { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 8px; font-size: 13px; }
.turn .who { font: 600 11.5px var(--sans); color: var(--ink-3); padding-top: 5px; }
.turn .what { padding: 7px 11px; border-radius: 9px; background: var(--sunk); }
.turn.bot .what { background: var(--graph-bg); }
.turn.customer .what { background: var(--proj-bg); font-family: var(--mono); font-size: 12px; }
.turn.tool .what { background: transparent; border: 1px dashed var(--line-strong); font-family: var(--mono); font-size: 12px; }
.act { font: 600 11.5px var(--mono); }

/* device and bot pickers: selectable sheets */
.devs { display: flex; flex-wrap: wrap; gap: 8px; }
.devs label { position: relative; display: inline-flex; flex-direction: column; justify-content: center; min-height: 46px; padding: 6px 13px; border: 1px solid var(--line-strong);
  border-radius: 9px; cursor: pointer; background: var(--panel); min-width: 96px; }
.devs input { position: absolute; opacity: 0; pointer-events: none; }
.devs label:has(input:checked) { border-color: var(--accent); background: var(--accent-bg); box-shadow: inset 0 0 0 1px var(--accent); }
.devs label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.devs label:has(input:disabled) { cursor: not-allowed; opacity: .5; }
.devs .dn { font: 600 13px var(--mono); } .devs .dd { font-size: 11px; color: var(--ink-3); }

/* run: the thirteen campaign steps */
.runlayout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 18px; align-items: start; }
.steps { list-style: none; margin: 0; padding: 6px; display: grid; gap: 1px; }
.steps button { width: 100%; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left;
  padding: 8px; border: 0; background: transparent; border-radius: 8px; cursor: pointer; min-height: 44px; }
.steps button:hover { background: var(--sunk); }
.steps button[aria-current="true"] { background: var(--accent-bg); }
.steps .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 600 11px var(--mono);
  border: 2px solid var(--line-strong); color: var(--ink-3); background: var(--panel); }
.steps .t { font-weight: 500; } .steps .p { font-size: 11.5px; color: var(--ink-3); }
.steps .s { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.st-done .n { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.st-running .n { border-color: var(--run); color: var(--run); box-shadow: 0 0 0 3px var(--run-bg); }
.st-failed .n { background: var(--bad); border-color: var(--bad); color: var(--panel); }
.st-skipped .t { color: var(--ink-3); text-decoration: line-through; }
.log { font: 12px/1.55 var(--mono); max-height: 260px; overflow: auto; padding: 11px 13px; background: var(--sunk); border-radius: 9px; white-space: pre-wrap; }
details > summary { cursor: pointer; padding: 11px 16px; font-weight: 600; }
.bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
.toast { position: fixed; right: 20px; bottom: 20px; z-index: 60; display: grid; gap: 8px; }
.toast div { background: var(--ink); color: var(--bg); padding: 11px 15px; border-radius: 10px; box-shadow: var(--float); max-width: 440px; font-size: 13.5px; }
dialog { border: 1px solid var(--line-strong); border-radius: 14px; background: var(--panel); color: var(--ink); padding: 22px; max-width: 460px; box-shadow: var(--float); }
dialog::backdrop { background: color-mix(in srgb, #050A14 45%, transparent); backdrop-filter: blur(2px); }
dialog h2 { font-size: 20px; }
.kv { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 7px 12px; font-size: 13px; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; }
/* bot under test */
.sut-choice { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.sut-choice label { position: relative; display: grid; gap: 2px; align-content: start; padding: 11px 13px; border: 1px solid var(--line-strong); border-radius: 10px; cursor: pointer; background: var(--panel); }
.sut-choice input { position: absolute; opacity: 0; pointer-events: none; }
.sut-choice label:has(input:checked) { border-color: var(--accent); background: var(--accent-bg); box-shadow: inset 0 0 0 1px var(--accent); }
.sut-choice label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.sut-choice .t { font-weight: 600; } .sut-choice .p { font-size: 12px; color: var(--ink-3); }
textarea.prompt { font: 12.5px/1.6 var(--mono); min-height: 280px; width: 100%; }
.fixed { font: 11.5px/1.55 var(--mono); max-height: 260px; overflow: auto; background: var(--sunk); padding: 11px 13px; border-radius: 9px; white-space: pre-wrap; margin: 0 16px 16px; }
.drop { border: 1.5px dashed var(--line-strong); border-radius: 10px; padding: 11px 13px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.drop.over { border-color: var(--accent); background: var(--accent-bg); }
/* case explorer */
.cx { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 18px; align-items: start; }
.clist { position: sticky; top: 76px; max-height: calc(100vh - 96px); display: flex; flex-direction: column; }
.clist .search { padding: 10px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.clist .items { overflow: auto; }
.ci { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
  background: transparent; padding: 9px 13px; cursor: pointer; color: inherit; border-left: 3px solid transparent; }
.ci:hover { background: var(--sunk); } .ci[aria-current="true"] { background: var(--accent-bg); border-left-color: var(--accent); }
.ci .id { font: 600 12.5px var(--mono); } .ci .sub { grid-column: 1 / -1; font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dots { display: inline-flex; gap: 3px; align-items: center; }
.res { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1.5px solid var(--line-strong); }
.res.ok { background: var(--ok); border-color: var(--ok); } .res.bad { background: var(--bad); border-color: var(--bad); }
.cmp td { font-size: 13px; min-width: 190px; } .cmp td.st { min-width: 160px; max-width: 220px; } .cmp td.num { min-width: 0; width: 30px; }
.cmp th .sub { display: block; font-weight: 400; color: var(--ink-3); white-space: normal; }
.level .tw td { overflow-wrap: anywhere; min-width: 90px; font-size: 12.5px; } .level .tw td:first-child { min-width: 0; }
.eq { display: block; margin-top: 4px; font: 11.5px var(--mono); } .eq.ok { color: var(--ok); } .eq.bad { color: var(--bad); }
.card-mini { font: 11.5px var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
table.heat td.c { text-align: center; font-variant-numeric: tabular-nums; min-width: 52px; cursor: pointer; }
table.heat td.c.zero { color: var(--ink-3); cursor: default; }
table.heat th.rowh { position: static; background: var(--sunk); text-align: left; }
.hbar { display: grid; grid-template-columns: 150px minmax(0, 1fr) 46px; gap: 8px; align-items: center; font-size: 12.5px; }
.hbar .track { height: 10px; background: var(--sunk); border-radius: 3px; overflow: hidden; display: flex; gap: 2px; }
.hbar .track i { display: block; height: 100%; background: var(--accent); border-radius: 0 3px 3px 0; }
/* playground */
.pg-set { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.pg { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 18px; align-items: start; }
.pg > aside { position: sticky; top: 76px; }
.chat { display: grid; gap: 10px; padding: 16px; }
.msg { max-width: min(86%, 720px); padding: 10px 13px; border-radius: 14px; overflow-wrap: anywhere; }
.msg .who { font: 600 11.5px var(--sans); color: var(--ink-3); margin-bottom: 3px; }
.msg.bot { background: var(--graph-bg); justify-self: start; border-top-left-radius: 4px; }
.msg.cust { background: var(--proj-bg); justify-self: end; border-top-right-radius: 4px; }
.msg .read { font: 11.5px var(--mono); color: var(--ink-3); margin-top: 4px; }
.verdict { justify-self: start; width: min(100%, 760px); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; display: grid; gap: 7px; font-size: 12.5px; background: var(--panel); }
.verdict .r { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; align-items: start; }
.verdict .lbl { font: 600 11.5px var(--sans); color: var(--ink-3); padding-top: 3px; }
.verdict .chips .chip { height: auto; min-height: 22px; white-space: normal; overflow-wrap: anywhere; padding: 2px 7px; }
.verdict ul { margin: 0; padding-left: 16px; }
.mark { font-weight: 650; } .mark.ok { color: var(--ok); } .mark.bad { color: var(--bad); } .mark.warn { color: var(--warn); }
.composer { border-top: 1px solid var(--line); padding: 12px 16px; display: grid; gap: 8px; background: var(--panel); border-radius: 0 0 var(--radius) var(--radius); }
.composer .row textarea { flex: 1; min-height: 46px; }
.lines { display: grid; gap: 6px; padding: 10px; max-height: calc(100vh - 170px); overflow: auto; }
.line { border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; display: grid; gap: 4px; font-size: 12.5px; }
.line.next { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.line.used { opacity: .6; }
.line .st { font: 11px var(--mono); color: var(--ink-3); overflow-wrap: anywhere; }
.line button.use { justify-self: start; }
.typing { justify-self: start; color: var(--ink-3); display: flex; gap: 8px; align-items: center; font-size: 12.5px; }
/* verdict */
.vbanner { border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 6px; }
.vbanner.ok { background: var(--ok-bg); color: var(--ok); } .vbanner.bad { background: var(--bad-bg); color: var(--bad); }
.vbanner .big { font: 600 28px var(--head); } .vbanner .why { font-size: 13px; display: grid; gap: 2px; }
.kv.fp { grid-template-columns: 170px minmax(0, 1fr); font-size: 12.5px; } .kv.fp dd { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.vcase { margin-bottom: 14px; } .vcase.fail { border-left: 3px solid var(--bad); }
.vgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.vside { border-radius: 9px; padding: 9px 11px; display: grid; gap: 3px; align-content: start; overflow-wrap: anywhere; }
.vside.exp { background: var(--graph-bg); } .vside.bot { background: var(--sunk); } .vside.bot.diff { box-shadow: inset 3px 0 0 var(--bad); }
.vside .lbl { font: 600 11.5px var(--sans); color: var(--ink-3); }
.vside .said { font-size: 13px; margin-top: 3px; }
.vhead { font: 600 11.5px var(--sans); color: var(--ink-3); padding: 0 10px; }
.vrest > summary { padding: 4px 0; font-weight: 500; color: var(--ink-2); }
.vturn { border: 1px solid var(--line); border-radius: 9px; padding: 9px; display: grid; gap: 8px; }
.vturn.bad { border-color: var(--bad); } .vturn.after { opacity: .75; }
.vcust { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: 13px; }
.vcust .who { font: 600 11px var(--mono); color: var(--ink-3); } .vcust .mark { margin-left: auto; font-size: 12px; }
@media print {
  .top, nav.rail, .no-print, .hint, .toast, #savebar, .savebar, .pagefoot, .crumb { display: none !important; }
  .shell { display: block; } main { padding: 0; } body { background: #fff; color: #000; font-size: 11.5px; }
  .card { box-shadow: none; } .vpage { break-after: page; border: 0; } .vturn, .vcase > .hd, .vgrid.head { break-inside: avoid; } .vcase > .hd, .vcases > .row { break-after: avoid; }
  .tw { max-height: none !important; overflow: visible; } a { color: inherit; text-decoration: none; }
  .vgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important; } .vside .mono, .vside .small { font-size: 10.5px; } .vside .said { font-size: 11.5px; }
  .vpage > .bd { padding: 0; gap: 10px; } .vpage .tiles { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .vpage .tile { padding: 6px 8px; } .vpage .tile .v { font-size: 16px; } .vpage .tile .l { font-size: 10.5px; }
  .vbanner { padding: 10px 12px; } .vbanner .big { font-size: 20px; } .vbanner .why { font-size: 11.5px; }
  .vpage table { font-size: 11px; } .vpage th, .vpage td { padding: 4px 6px; }
  .kv.fp { grid-template-columns: 110px minmax(0, 1fr) 110px minmax(0, 1fr); gap: 3px 10px; font-size: 10.5px; } .kv.fp dd { font-size: 10.5px; }
}

/* graph sections, editor, sphere: one colour per section (with its name beside it everywhere) */
.sdot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }
.secgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-top: 12px; }
.seccard { text-align: left; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 11px 13px; cursor: pointer; display: grid; gap: 3px; align-content: start; color: inherit; }
.seccard:hover { border-color: var(--accent); }
.seccard[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-bg); }
.seccard .v { font: 600 24px/1.1 var(--head); }
.seccard .row { flex-wrap: nowrap; align-items: center; }
.crit { margin-top: 6px; color: var(--ink-2); } .crit summary { cursor: pointer; color: var(--accent); } .crit-row { margin-top: 6px; padding: 7px 9px; background: var(--sunk); border-radius: 7px; display: grid; gap: 2px; overflow-wrap: anywhere; }
.seccard .small { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.chips.ents { max-height: 150px; overflow: auto; }
.chip .etype { font-family: var(--sans); font-size: 10.5px; color: var(--ink-3); }
.segs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; max-height: 640px; overflow: auto; }
.segs li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; }
.segs .t { font-weight: 600; font-size: 13px; }
.segs li.miss .t { color: var(--warn); }
.elist { display: grid; gap: 4px; max-height: 560px; overflow: auto; }
.eitem { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 10px; cursor: pointer; display: grid; gap: 2px; min-width: 0; color: inherit; }
.eitem:hover { border-color: var(--accent); }
.eitem .mono { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.eitem[aria-current="true"] { border-color: var(--accent); background: var(--accent-bg); }
.input.s { height: 28px; font-size: 12px; padding: 0 7px; }
tr.edited td { background: var(--warn-bg); }
.sphwrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
.sphbox { position: relative; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
canvas.sph { display: block; width: 100%; height: min(72vh, 680px); cursor: grab; touch-action: none; border-radius: var(--radius); }
canvas.sph:active { cursor: grabbing; }
.sphtip { position: absolute; display: none; pointer-events: none; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 7px; padding: 6px 9px; box-shadow: var(--float); font-size: 12px; max-width: 280px; overflow-wrap: anywhere; }

/* playground: one exchange per turn, customer beside agent, the answer sheet folded underneath */
.jlines { margin: 4px 0 0; padding-left: 20px; display: grid; gap: 3px; color: var(--ink-2); }
.xlist { display: grid; gap: 12px; }
.xturn { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 12px 14px; display: grid; gap: 10px; scroll-margin-top: 80px; }
.xturn.first { border-color: var(--bad); box-shadow: inset 3px 0 0 var(--bad); }
.xturn.dev { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.xhd { display: flex; align-items: center; gap: 10px; }
.xhd .n { font: 600 14px var(--head); }
.xbadge { margin-left: auto; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; }
.xbadge.ok { background: var(--ok-bg); color: var(--ok); } .xbadge.first, .xbadge.dev { background: var(--bad-bg); color: var(--bad); }
.xgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 12px; }
.xside { border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.xside.cust { background: var(--proj-bg); } .xside.bot { background: var(--graph-bg); }
.xlbl { font: 600 12px var(--sans); color: var(--ink-3); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.xside .said { font-size: 14px; overflow-wrap: anywhere; }
.mode { font-weight: 500; font-size: 11.5px; border-radius: 999px; padding: 1px 8px; background: var(--panel); color: var(--ink-2); border: 1px solid var(--line); }
.mode.free { color: var(--proj); border-color: color-mix(in srgb, var(--proj) 40%, var(--line)); }
.cmp2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.cmp2 .k, .pgside .k { font-size: 11.5px; color: var(--ink-3); margin-bottom: 3px; }
.cmp2 .chip { height: auto; min-height: 22px; white-space: normal; overflow-wrap: anywhere; padding: 2px 7px; background: var(--panel); }
.xwhy { margin: 0; padding: 8px 12px 8px 28px; background: var(--bad-bg); color: var(--bad); border-radius: 9px; font-size: 13px; display: grid; gap: 3px; }
.xsheet > summary { padding: 4px 0; font-size: 13px; color: var(--accent); font-weight: 600; }
.xsheet[open] > summary { margin-bottom: 8px; }
.xsheet .xgrid { grid-template-columns: minmax(0, 1fr); gap: 16px; }
.xsheet .sheet-kv { grid-template-columns: 110px minmax(0, 1fr); max-width: 900px; }
.sheet-kv { grid-template-columns: 100px minmax(0, 1fr); }
ul.rl { margin: 0; padding-left: 16px; display: grid; gap: 2px; }
table.hops td { font-size: 12px; white-space: pre-line; } table.hops td.mono { font-size: 11.5px; }
.compose2 { position: sticky; bottom: 12px; z-index: 5; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 12px;
