[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "turnval"
version = "0.1.0"
description = "Turn-validator dataset generation (AOP flow + HRT graph) and contrastive LoRA training of gpt-oss-20b"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=1.5", "pyyaml>=6.0", "scikit-learn>=1.2", "requests>=2.28"]

[project.optional-dependencies]
train = ["torch>=2.4", "transformers>=4.55", "peft>=0.17", "accelerate>=0.33", "safetensors", "tokenizers"]
test = ["pytest", "nbclient", "nbformat", "ipykernel"]

[tool.setuptools.packages.find]
include = ["turnval*"]

[tool.setuptools.package-data]
turnval = ["config/*.yaml", "train/*.yaml", "notebooks/*.ipynb"]
