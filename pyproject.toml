[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gmsjourney"
version = "0.4.0"
description = "GMS-grounded journey testing for a charge-review voice bot (method of 'Beyond Ship and Pray'), on knowlytix + proofloop + forgeloop"
requires-python = ">=3.12"
# knowlytix-core ships CPython 3.12 wheels only and needs a runtime licence (KNOWLYTIX_LICENSE_KEY);
# proofloop / forgeloop are Apache-2.0.
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=1.5", "pyyaml>=6.0",
                "knowlytix==1.5.0", "proofloop>=0.1.5", "forgeloop>=0.1.4"]

[project.optional-dependencies]
test = ["pytest"]
# only to rebuild the policy graph from the PDF (python -m gmsjourney.knowledge.policy_kg build)
pdf = ["pypdf>=4.0"]
# the LLM enrichment arm (the Microsoft model gateway; gcloud token)
llm = ["requests>=2.28", "tqdm>=4.60"]

[tool.setuptools.packages.find]
include = ["gmsjourney*"]

[tool.setuptools.package-data]
gmsjourney = ["policy/*/*.md", "policy/*/*.json", "policy/*/*.yaml", "catalogs/official/*.yaml", "catalogs/official/*.md"]
